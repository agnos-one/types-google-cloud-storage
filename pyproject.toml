[project]
name = "types-google-cloud-storage"
version = "0.3.0"
description = "Partial typing stubs for google-cloud-storage"
readme = "README.md"
authors = [
    { name = "Kun Yang" }
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["google-cloud-storage", "gcs", "stubs", "typing", "pyright"]
requires-python = ">=3.14"
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Stubs Only",
]

dependencies = [
    "google-api-core>=2.27.0,<3.0.0",
    "google-auth>=2.26.1,<3.0.0",
]

[project.urls]
Homepage = "https://github.com/agnos-one/types-google-cloud-storage"
Repository = "https://github.com/agnos-one/types-google-cloud-storage"
Issues = "https://github.com/agnos-one/types-google-cloud-storage/issues"
Changelog = "https://github.com/agnos-one/types-google-cloud-storage/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "google-stubs"
namespace = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "google-cloud-storage==3.17.2",
    "mypy>=1.20.0",
    "pyright>=1.1.414",
    "ruff>=0.17.6",
]
